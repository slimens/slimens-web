<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чат Телефаперов</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <h2>Чат Телефаперов</h2>
      <span id="userBadge" class="user-badge"></span>
    </header>

    <div id="messagesContainer" class="messages-container"></div>

    <footer class="chat-footer">
      <input type="file" id="fileInput" hidden onchange="sendFile()">
      <button type="button" class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Файл">📎</button>
      
      <input type="text" id="messageInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" autocomplete="off">
      <button type="button" class="send-btn" onclick="sendMessage()">➤</button>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
